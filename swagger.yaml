basePath: /
definitions:
  models.Inventory:
    properties:
      id:
        type: integer
      price:
        type: number
      product_name:
        type: string
      quantity:
        type: integer
      supplier_id:
        type: integer
    type: object
  models.Shipment:
    properties:
      delivery_date:
        type: string
      destination:
        type: string
      id:
        type: integer
      inventory_id:
        type: integer
      shipment_date:
        type: string
      source:
        type: string
      status:
        type: string
      tracking_number:
        type: string
    type: object
  models.Supplier:
    properties:
      address:
        type: string
      email:
        type: string
      id:
        type: integer
      phone:
        type: string
      supplier_name:
        type: string
    type: object
  models.User:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Supply Chain Management System using Golang, Gin, PostgreSQL
  title: Supply Chain Management API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Login and generate JWT token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Login User
      tags:
      - Authentication
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user
      parameters:
      - description: User
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Register User
      tags:
      - Authentication
